dth=\"4\" height=\"26\" rx=\"2\" fill=\"#E0A53C\"><\u002Frect><rect x=\"14\" y=\"7\" width=\"4\" height=\"26\" rx=\"2\" fill=\"#E0A53C\"><\u002Frect><rect x=\"22\" y=\"7\" width=\"4\" height=\"26\" rx=\"2\" fill=\"#E0A53C\"><\u002Frect><rect x=\"30\" y=\"7\" width=\"4\" height=\"26\" rx=\"2\" fill=\"#E0A53C\"><\u002Frect><rect x=\"18\" y=\"1.5\" width=\"4\" height=\"37\" rx=\"2\" fill=\"#3F8F5B\" transform=\"rotate(45 20 20)\"><\u002Frect><\u002Fsvg><\u002Fspan>Tally<\u002Fdiv>\n      <div class=\"foot-sub\">AI-powered checkout for fast casual · tallytodayai.com · <a href=\"mailto:neb@tallytodayai.com\">neb@tallytodayai.com<\u002Fa><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<div class=\"modal-overlay\" id=\"login-modal\" onclick=\"if(event.target===this)closeLogin()\">\n  <div class=\"modal-box\">\n    <button class=\"modal-x\" onclick=\"closeLogin()\" aria-label=\"Close\">×<\u002Fbutton>\n    <div class=\"modal-logo\"><span class=\"modal-logo-mark\"><svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><rect x=\"6\" y=\"7\" width=\"4\" height=\"26\" rx=\"2\" fill=\"#E0A53C\"><\u002Frect><rect x=\"14\" y=\"7\" width=\"4\" height=\"26\" rx=\"2\" fill=\"#E0A53C\"><\u002Frect><rect x=\"22\" y=\"7\" width=\"4\" height=\"26\" rx=\"2\" fill=\"#E0A53C\"><\u002Frect><rect x=\"30\" y=\"7\" width=\"4\" height=\"26\" rx=\"2\" fill=\"#E0A53C\"><\u002Frect><rect x=\"18\" y=\"1.5\" width=\"4\" height=\"37\" rx=\"2\" fill=\"#3F8F5B\" transform=\"rotate(45 20 20)\"><\u002Frect><\u002Fsvg><\u002Fspan>Tally<\u002Fdiv>\n    <div id=\"login-form\">\n      <h2>Client login<\u002Fh2>\n      <p>Sign in to your restaurant's Tally dashboard.<\u002Fp>\n      <input class=\"modal-input\" id=\"login-user\" placeholder=\"Username\" autocomplete=\"username\">\n      <input class=\"modal-input\" id=\"login-pass\" type=\"password\" placeholder=\"Password\" autocomplete=\"current-password\" onkeydown=\"if(event.key==='Enter')doLogin()\">\n      <button class=\"modal-btn\" onclick=\"doLogin()\">Sign in →<\u002Fbutton>\n      <div class=\"modal-err\" id=\"login-err\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"login-success\" style=\"display:none;\">\n      <div class=\"login-check\">✓<\u002Fdiv>\n      <p style=\"margin-top:16px;\">You're in. Your dashboard is being finalized ahead of full launch, we'll email you the moment it's ready.<\u002Fp>\n      <button class=\"modal-btn\" style=\"margin-top:22px;\" onclick=\"closeLogin()\">Done<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n/* ════════════════════════════════════════════════════════════════\n   Tally engine, inlined for reliable single-file deployment\n   ════════════════════════════════════════════════════════════════ */\n(function () {\n  'use strict';\n\n  /* ---------- Page / tab switching ---------- */\n  window.showPage = function (name, btn) {\n    var target = document.getElementById('page-' + name);\n    var current = document.querySelector('.page.active');\n    if (!target || target === current) return;\n    document.querySelectorAll('.nav-link').forEach(function (l) {\n      l.classList.toggle('active', l.getAttribute('data-page') === name);\n    });\n    function activateTarget() {\n      target.classList.add('active');\n      requestAnimationFrame(function () {\n        requestAnimationFrame(function () { target.classList.add('show'); });\n      });\n      window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });\n      requestAnimationFrame(revealVisible);\n    }\n    if (current) {\n      current.classList.remove('show');\n      setTimeout(function () {\n        current.classList.remove('active');\n        activateTarget();\n      }, 260);\n    } else {\n      activateTarget();\n    }\n  };\n\n  window.goContact = function () {\n    var el = document.getElementById('contact');\n    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' });\n  };\n\n  window.smoothTo = function (id) {\n    var el = document.getElementById(id);\n    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' });\n  };\n\n  /* ---------- Footer nav (cross-page anchors) ---------- */\n  window.footNav = function (page, id) {\n    var target = document.getElementById('page-' + page);\n    var scroll = function () { window.smoothTo(id); };\n    if (target && !target.classList.contains('active')) {\n      showPage(page);\n      setTimeout(scroll, 320);\n    } else {\n      scroll();\n    }\n  };\n\n  /* ---------- Client login (cosmetic, no real backend) ---------- */\n  window.openLogin = function () {\n    var m = document.getElementById('login-modal');\n    if (!m) return;\n    document.getElementById('login-form').style.display = 'block';\n    document.getElementById('login-success').style.display = 'none';\n    document.getElementById('login-err').textContent = '';\n    m.classList.add('open');\n  };\n  window.closeLogin = function () {\n    var m = document.getElementById('login-modal');\n    if (!m) return;\n    m.classList.remove('open');\n    var u = document.getElementById('login-user'), p = document.getElementById('login-pass');\n    if (u) u.value = '';\n    if (p) p.value = '';\n  };\n  window.doLogin = function () {\n    var u = document.getElementById('login-user').value.trim();\n    var p = document.getElementById('login-pass').value.trim();\n    var err = document.getElementById('login-err');\n    if (!u || !p) { err.textContent = 'Enter a username and password to continue.'; return; }\n    err.textContent = 'Invalid username or password. Access is limited to provisioned client credentials.';\n  };\n  document.addEventListener('keydown', function (e) {\n    if (e.key === 'Escape') window.closeLogin();\n  });\n\n  /* ---------- Scroll reveal ---------- */\n  function revealVisible() {\n    document.querySelectorAll('.reveal:not(.in)').forEach(function (el) {\n      var r = el.getBoundingClientRect();\n      if (r.top < window.innerHeight * 0.92 && r.bottom > 0) el.classList.add('in');\n    });\n  }\n\n  /* ═══════════════════════════════════════════════════════════════\n     ✏️  EDIT YOUR NUMBERS HERE\n     ─────────────────────────────────────────────────────────────\n     Change any value in N and it updates everywhere on the page.\n     ═══════════════════════════════════════════════════════════════ */\n  var N = {\n    /* ── Pricing (confirmed model: $399 SaaS + $199 hardware lease, both recurring) ─── */\n    pricePilot:    399,    // $/mo, software per location\n    hardwareLease: 199,    // $/mo, hardware lease per location\n    priceMulti:    598,    // $/mo, all-in per location (software + hardware lease)\n    priceHardware: 199,    // $/mo, hardware lease (shown on Hardware card)\n\n    /* ── ROI Calculator ──────────────── */\n    roiHours: 11,          // cashier hours per operating day\n    roiDays:  30,          // operating days per month\n    bowlsDef: 250, bowlsMin:  50, bowlsMax: 800,\n    wageDef:   20, wageMin:   12, wageMax:   35,\n    cashDef:    1, cashMin:    1, cashMax:    4,\n\n    /* ── Fully-loaded labor buildup (NOT from filings, modeling assumptions) ──\n       Base wage above is loaded up with taxes/insurance, OT premium,\n       benefits, amortized turnover, and compliance overhead to get a\n       real per-hour cost of a cashier position. See methodology panel. */\n    payrollTaxPct:   0.12,  // FICA + NY SUI/FUTA/MTA/workers' comp/DBL, composite estimate\n    otPremiumPct:    0.03,  // NY spread-of-hours premium, estimated incidence\n    benefitsPerHr:   2.15,  // benefits/meals/uniforms, estimated partial take-up\n    turnoverPerHr:   1.70,  // amortized turnover cost (~120%+ annual churn × ~$3K/hire, industry rule of thumb)\n    complianceperHr: 0.50,  // NYC Fair Workweek scheduling/admin overhead estimate\n    coverageHoursPeak: 60,  // hrs/wk to cover one cashier position, peak-only\n    coverageHoursFull: 91,  // hrs/wk to cover one cashier position, open-to-close\n\n    /* ── Hero Stats ──────────────────── */\n    checkout:     '8s',    // avg checkout time shown on hero (estimated, see disclosure)\n    checkoutFrom: '43s',   // baseline checkout time before Tally (estimated, see disclosure)\n    cashierLabel: 'Zero',  // cashiers needed label\n    paybackStat:  '7.7\\u00D7',  // operator ROI headline (conservative, sourced)\n\n    /* ── Investor Metrics ────────────── */\n    tam:       '$99B+',    // total addressable market\n    units:     '44,000+',  // fast casual units in market\n    arr:       '$6M',      // 24-month ARR target\n\n    /* ── Raise Terms ─────────────────── */\n    raise:      '$500K',    // amount raising\n    instrument: 'SAFE note',\n    closeDate:  'Q4 2026'   // target close quarter\n  };\n\n  /* ---------- Inject N into DOM ---------- */\n  function injectNumbers() {\n    var map = {\n      'num-checkout':    N.checkout,\n      'num-checkout-from':N.checkoutFrom,\n      'num-cashier':     N.cashierLabel,\n      'num-payback-stat-feat':N.paybackStat,\n      'num-price-pilot': '$' + N.pricePilot,\n      'num-price-multi': '$' + N.priceMulti,\n      'num-price-hw':    '$' + N.priceHardware,\n      'num-tam':         N.tam,\n      'num-units':       N.units,\n      'num-arr':         N.arr,\n      'num-raise':       N.raise,\n      'num-instrument':  N.instrument,\n      'num-close':       N.closeDate\n    };\n    Object.keys(map).forEach(function (id) {\n      var el = document.getElementById(id);\n      if (el) el.textContent = map[id];\n    });\n  }\n\n  /* ---------- ROI calculator ---------- */\n\n  function money(n) {\n    return '$' + Math.round(n).toLocaleString('en-US');\n  }\n\n  function loadedWage(baseWage) {\n    return baseWage * (1 + N.payrollTaxPct + N.otPremiumPct) + N.benefitsPerHr + N.turnoverPerHr + N.complianceperHr;\n  }\n\n  window.calcROI = function () {\n    var b = document.getElementById('roi-bowls');\n    var w = document.getElementById('roi-wage');\n    var c = document.getElementById('roi-cashiers');\n    if (!b || !w || !c) return;\n    var bowls = +b.value, baseWage = +w.value, cash = +c.value;\n    var wage = loadedWage(baseWage);\n    setText('bowls-display', bowls);\n    setText('wage-display', '$' + baseWage);\n    setText('cashiers-display', cash);\n\n    var monthlyCost = N.pricePilot + N.hardwareLease; // all-in: software + hardware lease\n    var monthlyLabor = wage * N.roiHours * N.roiDays * cash;\n    var net = monthlyLabor - monthlyCost;\n    var annual = monthlyLabor * 12;\n    var roiMultiple = monthlyCost > 0 ? (monthlyLabor / monthlyCost) : 0;\n\n    animateNumber('roi-monthly', net);\n    animateNumber('roi-annual', annual);\n    setText('roi-fee', money(monthlyCost));\n    setText('roi-payback', roiMultiple.toFixed(1) + '\\u00D7');\n    setText('roi-loaded', '$' + wage.toFixed(2) + '/hr');\n  };\n\n  function setText(id, v) {\n    var el = document.getElementById(id);\n    if (el) el.textContent = v;\n  }\n\n  function animateNumber(id, target) {\n    var el = document.getElementById(id);\n    if (!el) return;\n    var start = parseFloat((el.getAttribute('data-val') || '0')) || 0;\n    var t0 = performance.now(), dur = 520;\n    function step(t) {\n      var k = Math.min(1, (t - t0) / dur);\n      var e = 1 - Math.pow(1 - k, 3);\n      var val = start + (target - start) * e;\n      el.textContent = money(val);\n      if (k < 1) requestAnimationFrame(step);\n      else el.setAttribute('data-val', target);\n    }\n    requestAnimationFrame(step);\n  }\n\n  /* ---------- Live line demo ---------- */\n  var ORDER = [\n    { st: 'Base',     item: 'Brown Rice',      price: 3.50 },\n    { st: 'Protein',  item: 'Grilled Chicken', price: 4.00 },\n    { st: 'Greens',   item: 'Romaine + Kale',  price: 1.00 },\n    { st: 'Toppings', item: 'Avocado',         price: 2.00 },\n    { st: 'Toppings', item: 'Cotija',          price: 1.00 },\n    { st: 'Sauce',    item: 'Chipotle Ranch',  price: 0.75 }\n  ];\n  var STATION_IDX = { Base: 0, Protein: 1, Greens: 2, Toppings: 3, Sauce: 4 };\n  var STATION_COUNT = 6; // Base..Sauce + Pay\n\n  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }\n  function fmt(n) { return '$' + n.toFixed(2); }\n\n  function setStation(root, idx) {\n    var rstations = root.querySelectorAll('.rstation');\n    var fill = root.querySelector('.rail-line-fill');\n    rstations.forEach(function (s) {\n      var i = +s.dataset.i;\n      s.classList.toggle('active', i === idx);\n      s.classList.toggle('done', i < idx);\n    });\n    if (fill) fill.style.width = (Math.max(idx, 0) / (STATION_COUNT - 1) * 100) + '%';\n  }\n\n  async function runDemo(root) {\n    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    var rows = root.querySelector('.ticket-rows');\n    var totalEl = root.querySelector('.ticket-total');\n    var statusEl = root.querySelector('.ticket-status');\n    var stampEl = root.querySelector('.ticket-stamp');\n    var accEl = root.querySelector('.feed-accuracy');\n    var caption = root.querySelector('.feed-caption');\n    if (!rows || !totalEl) return;\n\n    while (true) {\n      rows.innerHTML = '';\n      totalEl.textContent = '$0.00';\n      if (stampEl) { stampEl.classList.remove('show'); }\n      if (statusEl) { statusEl.textContent = 'Building order'; statusEl.dataset.state = 'building'; }\n      if (accEl) accEl.textContent = '99.2%';\n      if (caption) caption.innerHTML = 'Order started, camera reading the line…';\n      setStation(root, -1);\n      var total = 0;\n\n      await sleep(reduced ? 300 : 1300);\n\n      for (var i = 0; i < ORDER.length; i++) {\n        var o = ORDER[i];\n        setStation(root, STATION_IDX[o.st]);\n        if (caption) caption.innerHTML = '<b>' + o.item + '<\u002Fb> confirmed, ' + o.st + ' station';\n\n        var row = document.createElement('div');\n        row.className = 'trow';\n        row.innerHTML = '<span class=\"trow-name\">' + o.item + '<\u002Fspan><span class=\"trow-price\">' + fmt(o.price) + '<\u002Fspan>';\n        rows.appendChild(row);\n        requestAnimationFrame(function (rw) { return function () { rw.classList.add('in'); }; }(row));\n\n        var from = total, to = total + o.price;\n        total = to;\n        await countUp(totalEl, from, to, reduced ? 60 : 480);\n        await sleep(reduced ? 160 : 900);\n      }\n\n      setStation(root, STATION_COUNT - 1);\n      if (caption) caption.innerHTML = 'Order closed, verifying total…';\n      if (statusEl) { statusEl.textContent = 'Total ready · tap to pay'; statusEl.dataset.state = 'ready'; }\n      await sleep(reduced ? 400 : 1500);\n      if (caption) caption.innerHTML = 'Guest taps card, <b>no cashier needed<\u002Fb>';\n      if (statusEl) { statusEl.textContent = 'Paid'; statusEl.dataset.state = 'paid'; }\n      if (stampEl) { stampEl.textContent = 'PAID · ' + N.checkout; stampEl.classList.add('show'); }\n      await sleep(reduced ? 800 : 3400);\n    }\n  }\n\n  function countUp(el, from, to, dur) {\n    return new Promise(function (resolve) {\n      var t0 = performance.now();\n      function step(t) {\n        var k = Math.min(1, (t - t0) / dur);\n        var e = 1 - Math.pow(1 - k, 3);\n        el.textContent = fmt(from + (to - from) * e);\n        if (k < 1) requestAnimationFrame(step); else resolve();\n      }\n      requestAnimationFrame(step);\n    });\n  }\n\n  /* ---------- Scroll-driven demo (How it works) ---------- */\n  var scrollDemoGen = 0;\n  function renderScrollStep(root, n) {\n    var myGen = ++scrollDemoGen;\n    var rows = root.querySelector('.ticket-rows');\n    var totalEl = root.querySelector('.ticket-total');\n    var statusEl = root.querySelector('.ticket-status');\n    var stampEl = root.querySelector('.ticket-stamp');\n    var caption = root.querySelector('.feed-caption');\n    if (!rows || !totalEl) return;\n    rows.innerHTML = ''; totalEl.textContent = '$0.00';\n    if (stampEl) stampEl.classList.remove('show');\n    if (statusEl) { statusEl.textContent = 'Building order'; statusEl.dataset.state = 'building'; }\n    setStation(root, -1);\n    if (caption) caption.innerHTML = 'Camera reads each ingredient as it is added, no scanning, no buttons.';\n\n    var itemsToShow = n <= 0 ? ORDER.slice(0, 3) : ORDER;\n    var total = 0;\n    itemsToShow.forEach(function (o, i) {\n      setTimeout(function () {\n        if (myGen !== scrollDemoGen) return;\n        setStation(root, STATION_IDX[o.st]);\n        if (caption) caption.innerHTML = '<b>' + o.item + '<\u002Fb> confirmed, ' + o.st + ' station';\n        if (n >= 1) {\n          var row = document.createElement('div');\n          row.className = 'trow';\n          row.innerHTML = '<span class=\"trow-name\">' + o.item + '<\u002Fspan><span class=\"trow-price\">' + fmt(o.price) + '<\u002Fspan>';\n          rows.appendChild(row);\n          requestAnimationFrame(function () { row.classList.add('in'); });\n          total += o.price;\n          totalEl.textContent = fmt(total);\n        }\n      }, i * 340);\n    });\n\n    if (n >= 2) {\n      var readyAt = itemsToShow.length * 340 + 500;\n      var paidAt = itemsToShow.length * 340 + 1400;\n      setTimeout(function () {\n        if (myGen !== scrollDemoGen) return;\n        setStation(root, STATION_COUNT - 1);\n        if (caption) caption.innerHTML = 'Order closed, verifying total…';\n        if (statusEl) { statusEl.textContent = 'Total ready · tap to pay'; statusEl.dataset.state = 'ready'; }\n      }, readyAt);\n      setTimeout(function () {\n        if (myGen !== scrollDemoGen) return;\n        if (caption) caption.innerHTML = 'Guest taps card, <b>no cashier needed<\u002Fb>';\n        if (statusEl) { statusEl.textContent = 'Paid'; statusEl.dataset.state = 'paid'; }\n        if (stampEl) { stampEl.textContent = 'PAID · ' + N.checkout; stampEl.classList.add('show'); }\n      }, paidAt);\n    }\n  }\n\n  function initScrolly() {\n    var wrap = document.getElementById('scrolly');\n    if (!wrap) return;\n    var steps = Array.prototype.slice.call(wrap.querySelectorAll('.sstep'));\n    var demo = wrap.querySelector('.live-demo-widget');\n    var rail = wrap.querySelectorAll('.scrolly-rail i');\n    var current = -1;\n    function activate(n) {\n      if (n === current) return;\n      current = n;\n      steps.forEach(function (s, i) { s.classList.toggle('active', i === n); });\n      rail.forEach(function (d, i) { d.classList.toggle('active', i === n); });\n      if (demo) renderScrollStep(demo, n);\n    }\n    if (steps.length) activate(0);\n    var obs = new IntersectionObserver(function (entries) {\n      entries.forEach(function (e) {\n        if (e.isIntersecting) activate(steps.indexOf(e.target));\n      });\n    }, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });\n    steps.forEach(function (s) { obs.observe(s); });\n  }\n\n  /* ---------- Comparison table motion ---------- */\n  function initCmpReveal() {\n    var rows = document.querySelectorAll('.cmp tbody tr');\n    if (!rows.length) return;\n    var obs = new IntersectionObserver(function (entries) {\n      entries.forEach(function (e) {\n        if (e.isIntersecting) {\n          var i = Array.prototype.indexOf.call(rows, e.target);\n          e.target.style.transitionDelay = (i * 70) + 'ms';\n          e.target.classList.add('in');\n          obs.unobserve(e.target);\n        }\n      });\n    }, { threshold: .2 });\n    rows.forEach(function (r) { obs.observe(r); });\n  }\n\n  /* ---------- FAQ accordion ---------- */\n  function initFAQ() {\n    document.querySelectorAll('.faq-q').forEach(function (btn) {\n      btn.addEventListener('click', function () {\n        var item = btn.closest('.faq-item');\n        var panel = item.querySelector('.faq-a');\n        var isOpen = item.classList.contains('open');\n        document.querySelectorAll('.faq-item.open').forEach(function (o) {\n          if (o !== item) { o.classList.remove('open'); o.querySelector('.faq-a').style.maxHeight = null; }\n        });\n        if (isOpen) { item.classList.remove('open'); panel.style.maxHeight = null; }\n        else { item.classList.add('open'); panel.style.maxHeight = panel.scrollHeight + 'px'; }\n      });\n    });\n  }\n\n  /* ---------- Pilot application form ---------- */\n  window.submitPilotForm = function (e) {\n    e.preventDefault();\n    var form = document.getElementById('pilot-form');\n    var btn = document.getElementById('pilot-submit');\n    if (!form.checkValidity()) { form.reportValidity(); return false; }\n    btn.disabled = true;\n    btn.innerHTML = '<span class=\"spin\"><\u002Fspan> Sending…';\n    setTimeout(function () {\n      form.style.display = 'none';\n      var alt = document.getElementById('pilot-alt');\n      if (alt) alt.style.display = 'none';\n      var success = document.getElementById('pilot-success');\n      if (success) success.classList.add('show');\n    }, 900);\n    return false;\n  };\n\n  /* ---------- Boot ---------- */\n  function setSlider(id, min, max, val) {\n    var el = document.getElementById(id);\n    if (!el) return;\n    el.min = min; el.max = max; el.value = val;\n  }\n\n  function boot() {\n    injectNumbers();\n    setSlider('roi-bowls', N.bowlsMin, N.bowlsMax, N.bowlsDef);\n    setSlider('roi-wage', N.wageMin, N.wageMax, N.wageDef);\n    setSlider('roi-cashiers', N.cashMin, N.cashMax, N.cashDef);\n    if (document.getElementById('roi-bowls')) {\n      setTimeout(function () {\n        document.querySelectorAll('.roi-res-v.skeleton').forEach(function (el) { el.classList.remove('skeleton'); });\n        window.calcROI();\n      }, 380);\n    }\n\n    revealVisible();\n    window.addEventListener('scroll', revealVisible, { passive: true });\n    window.addEventListener('resize', revealVisible);\n\n    document.querySelectorAll('.autoplay').forEach(function (d) { runDemo(d); });\n    initScrolly();\n    initCmpReveal();\n    initFAQ();\n    initTilt();\n  }\n\n  /* subtle desktop-only pointer tilt on cards */\n  function initTilt() {\n    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    var fine = window.matchMedia && window.matchMedia('(pointer: fine)').matches;\n    if (reduced || !fine) return;\n    var els = document.querySelectorAll('.step,.ocard,.opp-card,.pcard,.metric,#line-demo');\n    els.forEach(function (el) {\n      var raf = null;\n      el.addEventListener('mousemove', function (e) {\n        var r = el.getBoundingClientRect();\n        var px = (e.clientX - r.left) / r.width - .5;\n        var py = (e.clientY - r.top) / r.height - .5;\n        if (raf) cancelAnimationFrame(raf);\n        raf = requestAnimationFrame(function () {\n          el.style.transform = 'perspective(900px) rotateX(' + (py * -4) + 'deg) rotateY(' + (px * 5) + 'deg) translateY(-3px)';\n        });\n      });\n      el.addEventListener('mouseleave', function () {\n        if (raf) cancelAnimationFrame(raf);\n        el.style.transform = '';\n      });\n    });\n  }\n\n  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', boot);\n  } else {\n    boot();\n  }\n})();\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
