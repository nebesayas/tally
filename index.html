    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

      // and sender identity (own child frame / direct parent) is checked

    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }

      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach

    const resourceMap = {};

    }

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;

    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

er{transform:scale(1.15);}\ninput[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--ink);border:3px solid var(--accent);cursor:pointer;}\n.roi-res-lbl{font-family:var(--font-m);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-d);margin-bottom:8px;display:block;}\n.roi-res-v{font-family:var(--font-d);font-weight:700;font-size:2.6rem;letter-spacing:-.03em;line-height:1;margin-bottom:26px;}\n.roi-res-v.accent{color:var(--total);}\n#roi-monthly{color:var(--total);}\n.roi-rule{height:1px;background:var(--line-d);margin:26px 0;}\n.roi-mini{display:flex;gap:36px;}\n.roi-mini .roi-res-v{font-size:1.4rem;margin-bottom:0;}\n\n/* roi skeleton, shown until first calc completes */\n.roi-res-v.skeleton{color:transparent!important;position:relative;overflow:hidden;background:linear-gradient(90deg,var(--line) 25%,var(--paper) 50%,var(--line) 75%);background-size:200% 100%;animation:roi-shimmer 1.3s ease-in-out infinite;border-radius:8px;}\n@keyframes roi-shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}\n\n/* comparison */\n.cmp-wrap{overflow-x:auto;margin-top:48px;border-radius:var(--r);border:1px solid var(--line);}\n.cmp{width:100%;min-width:680px;border-collapse:separate;border-spacing:0;background:var(--paper-2);color:var(--ink);font-size:.92rem;}\n.cmp th{padding:18px 22px;text-align:left;font-family:var(--font-m);font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--paper);border-bottom:1px solid var(--line);}\n.cmp th.hl{background:var(--ink);color:var(--accent);}\n.cmp td{padding:15px 22px;border-bottom:1px solid var(--line);color:var(--ink);}\n.cmp tbody tr td:first-child{font-weight:600;color:var(--ink);}\n.cmp tbody tr:hover td{background:#F6F1E7;}\n.cmp tbody tr:hover td.hl{background:color-mix(in oklch,var(--accent),transparent 84%);}\n.cmp td.hl{background:color-mix(in oklch,var(--accent),transparent 90%);font-weigh (--muted-d);margin:18px auto 32px;}\n.cta-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:0 auto;}\n.cta-form input{padding:13px 15px;background:#181A20;border:1px solid var(--line-d);border-radius:var(--r-s);color:var(--paper);outline:none;transition:var(--t);}\n.cta-form input:focus{border-color:var(--accent);}\n.cta-form .full{grid-column:1/-1;}\n.cta-form .btn{width:100%;justify-content:center;}\n.cta-alt{margin-top:18px;font-family:var(--font-m);font-size:.78rem;color:var(--muted-d);}\n.cta-alt a{color:var(--accent);}\n\n/* investor */\n.inv-hero{padding:128px 0 88px;background:var(--ink);color:var(--paper);position:relative;overflow:hidden;}\n.inv-hero::after{content:'';position:absolute;right:-10%;top:-20%;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,color-mix(in oklch,var(--accent),transparent 78%),transparent 68%);}\n.inv-hero-in{position:relative;z-index:1;}\n.inv-title{font-size:clamp(2.4rem,5vw,4rem);max-width:16ch;color:var(--paper);}\n.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:54px;}\n.metric{padding:32px 28px;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-s);transition:transform .3s cubic-bezier(.2,.7,.2,1),border-color .3s,box-shadow .3s;}\n.metric:hover{transform:translateY(-4px);border-color:var(--accent-d);box-shadow:0 16px 34px rgba(14,15,19,.08);}\n.metric-v{font-family:var(--font-d);font-weight:700;font-size:2.9rem;letter-spacing:-.03em;line-height:1;}\n.metric-l{font-family:var(--font-m);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px;}\n.opp{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px;}\n.opp-card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);padding:30px;transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .35s,box-shadow .35s;}\n.opp-card:hover{transform:translateY(-4px);border-color:var(--accent-d);box-shadow:0 18px 40px rgba(14,15,19,.1);}\n.opp-n{font-family:var(--font-d);font-weight:700;font-size:2.4rem;color:var(--accent-d);letter-spacing:-.03em;}\n.opp-card h3{font-size:1.15rem;margin:12px 0 9px;}\n.opp-card p{font-size:.92rem;color:var(--muted);line-height:1.6;}\n.raise{display:grid;grid-template-columns:1fr 1fr;gap:48px;background:var(--ink);color:var(--paper);border-radius:var(--r);padding:52px;margin-top:48px;}\n.raise-terms{display:grid;grid-template-columns:1fr 1fr;gap:26px;}\n.rt-l{font-family:var(--font-m);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-d);margin-bottom:7px;}\n.rt-v{font-family:var(--font-d);font-weight:600;font-size:1.45rem;}\n.fund{margin-bottom:18px;}\n.fund-top{display:flex;justify-content:space-between;font-family:var(--font-m);font-size:.78rem;color:var(--muted-d);margin-bottom:7px;}\n.fund-track{height:7px;background:#23262e;border-radius:4px;overflow:hidden;}\n.fund-fill{height:100%;background:var(--accent);border-radius:4px;transition:width 1s cubic-bezier(.2,.8,.2,1);}\n.road{margin-top:48px;position:relative;padding-left:8px;}\n.road::before{content:'';position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:var(--line);}\n.ritem{position:relative;padding:0 0 34px 38px;}\n.ritem::before{content:'';position:absolute;left:0;top:6px;width:16px;height:16px;border-radius:50%;background:var(--paper-2);border:3px solid var(--accent);}\n.ritem:last-child{padding-bottom:0;}\n.rq{font-family:var(--font-m);font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-d);}\n.ritem h3{font-size:1.2rem;margin:5px 0 6px;}\n.ritem p{font-size:.92rem;color:var(--muted);}\n.team{display:flex;gap:16px;flex-wrap:wrap;margin-top:48px;}\n.tcard{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);padding:28px;min-width:260px;transition:transform .3s cubic-bezier(.2,.7,.2,1),border-color .3s;}\n.tcard:hover{transform:translateY(-4px);border-color:var(--accent-d);}\n.tava{width:48px;height:48px;border-radius:12px;background:var(--ink);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;margin-bottom:16px;}\n.tcard h3{font-size:1.2rem;} .tcard .role{font-family:var(--font-m);font-size:.72rem;color:var(--accent-d);letter-spacing:.04em;margin-top:3px;}\n\n/* assumptions tucked away */\n.assume{margin-top:60px;border-top:1px solid var(--line);padding-top:24px;}\n.assume summary{cursor:pointer;font-family:var(--font-m);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);list-style:none;display:flex;align-items:center;gap:9px;}\n.assume summary::-webkit-details-marker{display:none;}\n.assume summary::before{content:'+';font-size:1rem;color:var(--accent-d);transition:transform var(--t);}\n.assume[open] summary::before{content:'–';}\n.assume ol{margin:18px 0 0;padding-left:20px;display:grid;gap:7px;}\n.assume li{font-size:.8rem;color:var(--muted);line-height:1.55;}\n\nfooter{background:var(--ink);color:var(--muted-d);padding:96px 0 60px;}\n\n/* large centred wordmark */\n.foot-wordmark-wrap{text-align:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:64px;margin-bottom:52px;}\n.foot-wordmark{display:inline-flex;align-items:center;gap:16px;}\n.foot-wm-mark{width:64px;height:64px;flex-shrink:0;}\n.foot-wm-mark svg{width:100%;height:100%;display:block;}\n.foot-wm-name{font-family:var(--font-d);font-style:italic;font-weight:400;font-size:clamp(3.2rem,8vw,6rem);letter-spacing:-.03em;color:var(--paper);line-height:1;}\n\n\n/* tally marks, corner (superscript badge) */\n.foot-wm-corner{position:relative;display:inline-flex;align-items:flex-start;}\n.tally-corner{display:inline-flex;gap:3px;align-items:flex-end;margin-left:2px;margin-top:6px;}\n.tally-corner i{display:block;width:3px;height:18px;background:var(--total-d);border-radius:2px;opacity:1;}\n.tally-corner i:nth-child(5){transform:rotate(-58 spacing:-.01em;line-height:1.12;}\n.inv-title{line-height:1.1;margin-bottom:0;}\n.inv-hero-in .sub{margin-top:46px;}\n.h-sec{line-height:1.1;margin-bottom:4px;}\n.sub{margin-top:30px;}\n.hero-title{font-size:clamp(2.5rem,5vw,4.1rem);line-height:1.12;letter-spacing:-.01em;margin-bottom:6px;}\n.hero-title .hl::after{height:.16em;bottom:.12em;border-radius:30px;opacity:.5;}\n.hero-sub{margin-top:26px;}\n.h-sec{font-size:clamp(2.3rem,4.6vw,3.5rem);letter-spacing:-.01em;}\n.hero-sub,.sub{font-weight:400;}\n.nav-link{font-family:var(--font-b);font-weight:600;letter-spacing:0;}\n.nav-cta{font-family:var(--font-b);font-weight:700;}\n.btn{font-family:var(--font-b);font-weight:700;}\n.live-pill,.cta-alt{font-weight:600;}\n.hstat-v,.metric-v,.opp-n,.pcard-price .n{font-weight:400;letter-spacing:-.01em;}\n.ticket-total{font-weight:400;}\n.rail-line-fill{background:var(--accent-d);}\n.ticket-status{background:#2E2720;}\n.cta-form input{background:#2E2720;}\n.fund-track{background:#332C24;}\n.tava,.step-icn{border-radius:50%;}\n.det-tag{font-weight:700;}\n\n/* demo brand badge */\n.demo-brand{position:absolute;top:12px;right:13px;display:inline-flex;align-items:center;gap:5px;font-family:var(--font-d);font-style:italic;font-size:.72rem;color:rgba(255,255,255,.3);pointer-events:none;letter-spacing:-.01em;}\n\n/* CTA watermark */\n.cta-watermark{position:relative;overflow:hidden;}\n.cta-watermark::before{content:'Tally';position:absolute;font-family:var(--font-d);font-style:italic;font-size:clamp(9rem,20vw,18rem);font-weight:400;letter-spacing:-.04em;color:rgba(255,255,255,.04);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;line-height:1;z-index:0;}\n.cta-watermark .wrap{position:relative;z-index:1;}\n.nav-login{border-left:1px solid var(--line);margin-left:4px;padding-left:16px;}\n.nav-right{display:flex;align-items:center;gap:14px;}\n.nav-login-top{background:none;border:none;font-family:var(--font-b);font-weight:600;font-size:.86rem;color:var(--muted);cursor:pointer;padding:8px 4px;transition:color var(--t);}\n.nav-login-top:hover{color:var(--ink);}\n@media(max-width:900px){.nav-login-top{display:none;}}\n/* -- generic modal (client login) -- */\n.modal-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(33,28,23,.6);backdrop-filter:blur(4px);}\n.modal-overlay.open{display:flex;}\n.modal-box{position:relative;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);padding:52px 44px;text-align:center;max-width:400px;width:90%;}\n.modal-x{position:absolute;top:16px;right:16px;background:none;border:none;font-size:1.4rem;line-height:1;color:var(--muted);cursor:pointer;}\n.modal-logo{font-family:var(--font-d);font-style:italic;font-size:2.1rem;letter-spacing:-.02em;margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:9px;color:var(--ink);}\n.modal-logo-mark{width:38px;height:38px;flex-shrink:0;}\n.modal-logo-mark svg{width:100%;height:100%;display:block;}\n.modal-box h2{font-family:var(--font-d);font-size:1.5rem;margin-bottom:8px;}\n.modal-box p{color:var(--muted);font-size:.9rem;margin-bottom:24px;}\n.modal-input{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--paper);outline:none;font-size:1rem;transition:border-color var(--t);margin-bottom:10px;box-sizing:border-box;}\n.modal-input:focus{border-color:var(--accent);}\n.modal-btn{width:100%;padding:13px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:var(--r-s);font-family:var(--font-b);font-weight:700;font-size:.95rem;cursor:pointer;transition:var(--t);}\n.modal-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px color-mix(in oklch,var(--accent),transparent 60%);}\n.modal-err{color:#B85C4F;font-size:.82rem;margin-top:10px;min-height:1.2em;}\n.login-check{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:0 auto;}\n\n/* ---- page transition ---- */\n.page{opacity:0;transform:translateY(8px);transition:opacity .32s ease,transform .32s ease;}\n.page.show{opacity:1;transform:none;}\n\n/* ---- tactile buttons ---- */\n.btn:active,.nav-cta:active{transform:scale(.96);}\n\n/* ---- staggered card reveal ---- */\n.steps .step,.board .ocard,.price-grid .pcard,.opp .opp-card{opacity:0;transform:translateY(18px);transition:opacity .55s cubic-bezier(.2,.7,.2,1),transform .55s cubic-bezier(.2,.7,.2,1);}\n.steps.in .step,.board.in .ocard,.price-grid.in .pcard,.opp.in .opp-card{opacity:1;transform:none;}\n.steps .step:nth-child(2),.board .ocard:nth-child(2),.price-grid .pcard:nth-child(2),.opp .opp-card:nth-child(2){transition-delay:.09s;}\n.steps .step:nth-child(3),.board .ocard:nth-child(3),.price-grid .pcard:nth-child(3),.opp .opp-card:nth-child(3){transition-delay:.18s;}\n\n/* ---- scrollytelling demo (how it works) ---- */\n.scrolly{display:grid;grid-template-columns:1fr;max-width:640px;margin:56px auto 0;}\n.scrolly-steps{display:flex;flex-direction:column;}\n.sstep{padding:40px 0;border-top:1px solid var(--line);opacity:.35;transition:opacity .4s ease;}\n.sstep:first-child{border-top:none;padding-top:0;}\n.sstep.active{opacity:1;}\n.sstep-n{font-family:var(--font-m);font-size:.72rem;font-weight:700;letter-spacing:.1em;color:var(--accent-d);margin-bottom:12px;}\n.sstep h3{font-size:1.6rem;margin-bottom:10px;}\n.sstep p{font-size:1rem;color:var(--muted);line-height:1.62;max-width:38ch;}\n\n\n/* shared live-demo widget (hero + scrolly reuse this) */\n.live-demo-widget{background:var(--ink);border-radius:var(--r);padding:20px;box-shadow:0 30px 80px rgba(14,15,19,.28);border:1px solid var(--line-d);}\n\n/* ---- scalability row ---- */\n.scale-row{display:flex;align-items:center;flex-wrap:wrap;gap:16px;margin-top:36px;}\n.scale-card{flex:1 1 160px;border:1px solid var(--line);border-radius:var(--r-s);padding:20px 18px;background:var(--paper-2);}\n.scale-card-total{background:var(--ink);border-color:var(--ink);}\n.scale-card-total .scale-v{color:var(--accent);}\n.scale-card-total .scale-l{color:var(--muted-d);}\n.scale-v{font-family:var(--font-d);font-weight:700;font-size:1.9rem;letter-spacing:-.02em;color:var(--ink);line-height:1;margin-bottom:8px;}\n.scale-l{font-size:.84rem;color:var(--muted-d);font-weight:600;}\n.scale-arr{font-family:var(--font-m);font-size:.72rem;letter-spacing:.03em;color:var(--muted);white-space:nowrap;text-align:center;flex:0 0 auto;}\n@media(max-width:820px){.scale-row{flex-direction:column;align-items:stretch;}.scale-card{flex:1 1 auto;}}\n\n/* ---- comparison table motion ---- */\n.cmp tbody tr{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.2,1);}\n.cmp tbody tr.in{opacity:1;transform:none;}\n.cmp tbody tr:hover{transform:scale(1.006);}\n.yes,.no,.part{display:inline-flex;align-items:center;gap:7px;}\n.yes::before,.no::before,.part::before{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;font-size:.62rem;font-weight:700;flex:0 0 auto;transition:transform .25s cubic-bezier(.2,1.5,.4,1);}\n.yes::before{content:'✓';background:color-mix(in oklch,var(--accent),transparent 76%);color:var(--accent-d);}\n.no::before{content:'✕';background:#F6E2DE;color:#B85C4F;}\n.part::before{content:'–';background:#FBEFD9;color:#9A6B1F;}\n.cmp tbody tr:hover .yes::before,.cmp tbody tr:hover .no::before,.cmp tbody tr:hover .part::before{transform:scale(1.18);}\n\n/* ---- FAQ ---- */\n.faq{margin-top:48px;max-width:760px;}\n.faq-item{border-bottom:1px solid var(--line);}\n.faq-item:first-child{border-top:1px solid var(--line);}\n.faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:24px 2px;background:none;border:none;text-align:left;font-family:var(--font-d);font-size:1.12rem;font-weight:600;color:var(--ink);cursor:pointer;}\n.faq-q .pm{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);position:relative;transition:border-color .25s;}\n.faq-q .pm::before,.faq-q .pm::after{content:'';position:absolute;top:50%;left:50%;background:var(--ink);transition:transform .3s ease;}\n.faq-q .pm::before{width:10px;height:1.5px;transform:translate(-50%,-50%);}\n.faq-q .pm::after{width:1.5px;height:10px;transform:translate(-50%,-50%);}\n.faq-item.open .faq-q .pm::after{transform:translate(-50%,-50%) scaleY(0);}\n.faq-item.open .faq-q .pm{border-color:var(--accent-d);}\n.faq-a{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.2,.7,.2,1);}\n.faq-a p{padding:0 2px 24px;color:var(--muted);font-size:.96rem;line-height:1.65;max-width:62ch;}\n\n/* ---- CTA form success state ---- */\n.cta-success{display:none;text-align:center;padding:16px 0 4px;}\n.cta-success.show{display:block;}\n.cta-success-check{width:52px;height:52px;border-radius:50%;background:color-mix(in oklch,var(--accent),transparent 78%);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;margin:0 auto 16px;animation:popIn .4s cubic-bezier(.2,1.5,.4,1);}\n@keyframes popIn{0%{transform:scale(.4);opacity:0;}100%{transform:scale(1);opacity:1;}}\n.cta-success h3{font-size:1.3rem;color:var(--paper);margin-bottom:8px;}\n.cta-success p{color:var(--muted-d);font-size:.92rem;max-width:42ch;margin:0 auto;}\n.btn[disabled]{opacity:.75;cursor:default;}\n.btn .spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .6s linear infinite;display:inline-block;}\n@keyframes spin{to{transform:rotate(360deg);}}\n\n/* ---- legal block on dark footer ---- */\nfooter .assume{border-top-color:var(--line-d);max-width:820px;margin:0 auto 40px;}\nfooter .assume summary{color:var(--muted-d);}\nfooter .assume summary::before{color:var(--accent);}\nfooter .assume li{color:var(--muted-d);}\nfooter .assume li strong{color:var(--paper);}\n.foot-copyright{font-family:var(--font-m);font-size:.68rem;color:var(--muted-d);text-align:center;letter-spacing:.04em;}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<nav>\n  <div class=\"logo\"><span class=\"logo-mark\"><svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><rect x=\"6\" y=\"7\" width=\"4\" height=\"26\" rx=\"2\" fill=\"#E0A53C\"><\u002Frect><rect x=\"14\" y=\"7\" width=\"4\" height=\"26\" rx=\"2\" fill=\"#E0A53C\"><\u002Frect><rect x=\"22\" y=\"7\" width=\"4\" height=\"26\" rx=\"2\" fill=\"#E0A53C\"><\u002Frect><rect x=\"30\" y=\"7\" width=\"4\" height=\"26\" rx=\"2\" fill=\"#E0A53C\"><\u002Frect><rect x=\"18\" y=\"1.5\" width=\"4\" height=\"37\" rx=\"2\" fill=\"#3F8F5B\" transform=\"rotate(45 20 20)\"><\u002Frect><\u002Fsvg><\u002Fspan>Tally<\u002Fdiv>\n  <div class=\"nav-tabs\">\n    <button class=\"nav-link active\" data-page=\"restaurant\" onclick=\"showPage('restaurant',this)\">Restaurants<\u002Fbutton>\n    <button class=\"nav-link\" data-page=\"investor\" onclick=\"showPage('investor',this)\">Investors<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"nav-right\">\n    <button class=\"nav-login-top\" onclick=\"openLogin()\">Client login<\u002Fbutton>\n    <button class=\"nav-cta\" onclick=\"goContact()\">Apply for a pilot<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- ══════════ RESTAURANTS ══════════ -->\n<div class=\"page active show\" id=\"page-restaurant\">\n  <section class=\"hero wrap\">\n    <div class=\"hero-grid\">\n      <div>\n        <h1 class=\"hero-title\">Lose the cash register.<br><span class=\"hl\">Faster lines, wider margins.<\u002Fspan><\u002Fh1>\n        <p class=\"hero-def\">Designed specifically for fast-casual, assembly-line concepts, like <strong>Chipotle<\u002Fstrong>, <strong>CAVA<\u002Fstrong>, and <strong>Sweetgreen<\u002Fstrong>, Tally is your cashier that never gets sick, never slows down, and never misses or misbills an order, at one location or across your whole footprint.<\u002Fp>\n        <p class=\"hero-sub\">A specialized AI camera tracks every order as it's built and bills it automatically. No cashier, no scanning, just a receipt.<\u002Fp>\n        <div class=\"hero-actions\">\n          <button class=\"btn btn-accent\" onclick=\"goContact()\">Apply for a pilot <span class=\"arr\">→<\u002Fspan><\u002Fbutton>\n          <button class=\"btn btn-ghost\" onclick=\"smoothTo('how')\">See how it works<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"hero-stat-feat\"><div class=\"hstat-feat-v\" id=\"num-payback-stat-feat\">7.7×<\u002Fdiv><div class=\"hstat-feat-l\">Operator ROI on Tally's all-in monthly cost†<\u002Fdiv><\u002Fdiv>\n        <div class=\"hero-strip\">\n          <div><div class=\"hstat-v\"><span id=\"num-checkout-from\">43s<\u002Fspan> → <span id=\"num-checkout\">8s<\u002Fspan><\u002Fdiv><div class=\"hstat-l\">Avg. checkout*<\u002Fdiv><\u002Fdiv>\n          <div><div class=\"hstat-v\">3–6%<\u002Fdiv><div class=\"hstat-l\">Margin recovered from under-rings<\u002Fdiv><\u002Fdiv>\n          <div><div class=\"hstat-v\" id=\"num-cashier\">Zero<\u002Fdiv><div class=\"hstat-l\">Cashier labor†<\u002Fdiv><\u002Fdiv>\n          <div><div class=\"hstat-v\">Better<\u002Fdiv><div class=\"hstat-l\">Insights, not just a total<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- LIVE DEMO -->\n      <div id=\"line-demo\" class=\"live-demo-widget autoplay\">\n        <div class=\"demo-top\">\n          <span class=\"demo-cam\"><span class=\"rec\"><\u002Fspan>Tally AI · station 3<\u002Fspan>\n          <span class=\"demo-acc\">accuracy <span class=\"feed-accuracy\">99.2%<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"demo-body\">\n          <div class=\"feed-stage\">\n            <div class=\"feed-label\">Reading the line<\u002Fdiv>\n            <div class=\"rail-wrap\">\n              <div class=\"rail-line\"><div class=\"rail-line-fill\"><\u002Fdiv><\u002Fdiv>\n              <div class=\"rail-stations\">\n                <div class=\"rstation\" data-i=\"0\"><span class=\"rdot\"><\u002Fspan><\u002Fdiv>\n                <div class=\"rstation\" data-i=\"1\"><span class=\"rdot\"><\u002Fspan><\u002Fdiv>\n                <div class=\"rstation\" data-i=\"2\"><span class=\"rdot\"><\u002Fspan><\u002Fdiv>\n                <div class=\"rstation\" data-i=\"3\"><span class=\"rdot\"><\u002Fspan><\u002Fdiv>\n                <div class=\"rstation\" data-i=\"4\"><span class=\"rdot\"><\u002Fspan><\u002Fdiv>\n                <div class=\"rstation\" data-i=\"5\"><span class=\"rdot\"><\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"feed-caption\">Reading order…<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"demo-side\">\n            <div class=\"ticket\">\n              <div class=\"ticket-h\"><span>Order #24<\u002Fspan><span>auto-tally<\u002Fspan><\u002Fdiv>\n              <div class=\"ticket-rows\"><\u002Fdiv>\n              <div class=\"ticket-foot\">\n                <div class=\"ticket-total-row\"><span class=\"ticket-total-label\">Total<\u002Fspan><span class=\"ticket-total\">$0.00<\u002Fspan><\u002Fdiv>\n                <div class=\"ticket-status\" data-state=\"building\">Building order<\u002Fdiv>\n                <div class=\"ticket-stamp\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- THE PROBLEM -->\n  <section class=\"section wrap\" id=\"problem\">\n    <div class=\"reveal\"><span class=\"eyebrow\">The problem<\u002Fspan>\n    <h2 class=\"h-sec\">Labor costs keep climbing. The register is where you win it back.<\u002Fh2>\n    <p class=\"sub\">Wages, benefits, and turnover only move one direction. Meanwhile every order still stalls at the same station: a cashier peels off a glove to type in, by hand, what your line just built, and misses what's actually in the bowl. That's the bottleneck. It's costing you on labor and on speed, at the exact same spot, every single order.<\u002Fp><\u002Fdiv>\n    <div class=\"opp reveal d1\">\n      <div class=\"opp-card\"><div class=\"opp-n\" style=\"color:var(--total-d);\">$90,480<\u002Fdiv><h3>The fully-loaded cost of one cashier<\u002Fh3><p>That's what a single register position runs, per year.<sup><a href=\"#assumptions\" style=\"color:inherit;text-decoration:none;\">†<\u002Fa><\u002Fsup> And labor costs keep climbing, eating straight into your margin.<\u002Fp><\u002Fdiv>\n      <div class=\"opp-card\"><div class=\"opp-n\">3–6%<\u002Fdiv><h3>Margin, under-rung away<\u002Fh3><p>Margins are already razor-thin. Ring a steak bowl as chicken and that gap comes straight off the bottom line.<\u002Fp><\u002Fdiv>\n      <div class=\"opp-card\"><div class=\"opp-n\" style=\"color:var(--total-d);\">1&nbsp;line<\u002Fdiv><h3>The rush slows at the register<\u002Fh3><p>A fast-moving line stalls the moment it hits checkout. Guests ready to grab and go end up waiting on one person typing.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- THE SOLUTION (before / after + what it's not) -->\n  <section class=\"section wrap\" id=\"ba\">\n    <div class=\"reveal\"><span class=\"eyebrow\">The solution<\u002Fspan>\n    <h2 class=\"h-sec\">Same line. Minus the register.<\u002Fh2>\n    <p class=\"sub\">Tally watches the line you already run and prices every order as it's built. By the time the bowl is closed, the bill is already done, no separate station, no re-ring, no wait. The guest just taps and goes.<\u002Fp><\u002Fdiv>\n    <div class=\"ba-grid reveal d1\">\n      <div class=\"ba-col ba-before\">\n        <div class=\"ba-tag\">Today<\u002Fdiv>\n        <ol class=\"ba-steps\">\n          <li>Guest's order is built on the line<\u002Fli>\n          <li>Guest walks to the register<\u002Fli>\n          <li class=\"ba-pain\">A cashier re-rings every item by hand<\u002Fli>\n          <li class=\"ba-pain\">Guest waits in line, then pays<\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n      <div class=\"ba-col ba-after\">\n        <div class=\"ba-tag\">With Tally<\u002Fdiv>\n        <div style=\"font-family:var(--font-d);font-style:italic;color:var(--accent);font-size:1.05rem;margin:-14px 0 20px;\">4 steps become 2. One less place to lose a guest.<\u002Fdiv>\n        <ol class=\"ba-steps\">\n          <li>Order is tallied automatically as it's built<\u002Fli>\n          <li>Guest taps card or phone, done<\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- benefits -->\n  <section class=\"section wrap\" id=\"benefits\">\n    <div class=\"reveal\"><span class=\"eyebrow\">Why operators switch<\u002Fspan>\n    <h2 class=\"h-sec\">One camera. Every register headache, gone.<\u002Fh2>\n    <p class=\"sub\">The register is where your labor budget leaks, your line backs up, and your revenue slips through under-rings and disputes. Tally closes all of it.<\u002Fp><\u002Fdiv>\n    <div class=\"steps reveal d1\">\n      <div class=\"step\"><div class=\"step-n\">LABOR<\u002Fdiv><div class=\"step-icn\"><span><\u002Fspan><\u002Fdiv><h3>Stop paying to ring people up<\u002Fh3><p>Card and contactless orders close with no one at a register, that labor goes back to the line and pickup, or off the schedule entirely.<\u002Fp><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-n\">SPEED<\u002Fdiv><div class=\"step-icn\"><span><\u002Fspan><\u002Fdiv><h3>Kill the checkout line<\u002Fh3><p>Checkout collapses from a queue to a tap, so the rush keeps moving instead of stacking up behind one register.<\u002Fp><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-n\">MARGIN<\u002Fdiv><div class=\"step-icn\"><span><\u002Fspan><\u002Fdiv><h3>Stop under-ringing your margin away<\u002Fh3><p>Fast casual runs on thin net margins, and every missed topping, wrong quantity, or dropped modifier is pure profit walking out the door. Tally prices exactly what was added, every time, so what's on the plate is what's on the bill.<\u002Fp><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-n\">QUALITY<\u002Fdiv><div class=\"step-icn\"><span><\u002Fspan><\u002Fdiv><h3>Catch portioning drift early<\u002Fh3><p>Tally logs every ingredient added, so you can see portioning trends by station and by shift, over-portioning that eats margin, or under-portioning that costs repeat guests, before it becomes a habit.<\u002Fp><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-n\">DISPUTES<\u002Fdiv><div class=\"step-icn\"><span><\u002Fspan><\u002Fdiv><h3>Fewer chargebacks<\u002Fh3><p>Every disputed charge costs you the sale <em>plus<\u002Fem> a processor fee of roughly <strong>$15–$50<\u002Fstrong>, and up to $100 for high-risk accounts.<sup><a href=\"#assumptions\" style=\"color:inherit;text-decoration:none;\">‡<\u002Fa><\u002Fsup> Each Tally charge carries a timestamped record of the ingredients actually added, so you have fast evidence to win \"item not received\" and friendly-fraud disputes instead of eating the fee.<\u002Fp><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-n\">VISIBILITY<\u002Fdiv><div class=\"step-icn\"><span><\u002Fspan><\u002Fdiv><h3>Order-level record<\u002Fh3><p>Every order has a visual log your team can pull up to resolve a guest question or dispute in seconds.<\u002Fp><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-n\">CONTROL<\u002Fdiv><div class=\"step-icn\"><span><\u002Fspan><\u002Fdiv><h3>Manual override, always<\u002Fh3><p>Staff can correct any line before the guest pays, Tally assists the line, it doesn't lock it.<\u002Fp><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-n\">FLEXIBLE<\u002Fdiv><div class=\"step-icn\"><span><\u002Fspan><\u002Fdiv><h3>Configured to your menu<\u002Fh3><p>Station count, ingredient list, modifiers, and pricing are set up around your actual concept, bowls, sandwiches, or a format we haven't seen yet, and updated remotely as your menu changes.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- how it works, scroll-driven demo -->\n  <section class=\"section wrap\" id=\"how\">\n    <div class=\"reveal\"><span class=\"eyebrow\">The process<\u002Fspan>\n    <h2 class=\"h-sec\">See it work. Then make it yours.<\u002Fh2>\n    <p class=\"sub\">Scroll to watch the line move through a real order, the stations, ingredients, and prices shown are a sample menu. Yours are configured to match your actual line during setup.<\u002Fp><\u002Fdiv>\n\n    <div class=\"scrolly\" id=\"scrolly\">\n      <div class=\"scrolly-steps\">\n        <div class=\"sstep\" data-step=\"0\">\n          <div class=\"sstep-n\">01, SEE<\u002Fdiv>\n          <h3>Read every order<\u002Fh3>\n          <p>Tally's proprietary AI reads every order as your team builds it, no scanning, no buttons, no slowdown.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"sstep\" data-step=\"1\">\n          <div class=\"sstep-n\">02, TALLY<\u002Fdiv>\n          <h3>Price builds itself<\u002Fh3>\n          <p>Each item updates a running total down the line. By the time the bowl is closed, the price is already waiting.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"sstep\" data-step=\"2\">\n          <div class=\"sstep-n\">03, PAY<\u002Fdiv>\n          <h3>Tap and go<\u002Fh3>\n          <p>Guests pay by card or phone on your existing POS, no dedicated cashier.<sup>*<\u002Fsup> The same record that built the total also backs you up if a charge is ever disputed. Cash still routes through staff.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"sstep\" data-step=\"3\">\n          <div class=\"sstep-n\">04, CUSTOMIZE<\u002Fdiv>\n          <h3>Configured to your line, not a template<\u002Fh3>\n          <p>Station count, ingredient list, modifiers, combos, and pricing are set up to match your actual menu, not a fixed demo. Menu changes, seasonal items, and new concepts get updated remotely, no hardware swap required.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- live order board -->\n  <section class=\"section dark\">\n    <div class=\"wrap\">\n      <div class=\"board-head reveal\">\n        <div><span class=\"eyebrow\">Operator view<\u002Fspan><h2 class=\"h-sec\">See every order as it moves.<\u002Fh2><\u002Fdiv>\n        <div class=\"live-pill\" style=\"background:#2E2720;border-color:var(--line-d);color:var(--muted-d);\"><span class=\"live-dot\"><\u002Fspan>Updating live<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"board reveal d1\">\n        <div class=\"ocard\">\n          <div class=\"ocard-top\"><span class=\"ocard-id\">#23<\u002Fspan><span class=\"ostat wait\"><span class=\"d\"><\u002Fspan>Awaiting pay<\u002Fspan><\u002Fdiv>\n          <div class=\"ocard-items\"><span class=\"chip\">Brown rice<\u002Fspan><span class=\"chip\">Chicken<\u002Fspan><span class=\"chip\">+2<\u002Fspan><\u002Fdiv>\n          <div class=\"ocard-foot\"><span class=\"lbl\">Ready<\u002Fspan><span class=\"amt\">$8.50<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ocard\">\n          <div class=\"ocard-top\"><span class=\"ocard-id\">#24<\u002Fspan><span class=\"ostat run\"><span class=\"d\"><\u002Fspan>In progress<\u002Fspan><\u002Fdiv>\n          <div class=\"ocard-items\"><span class=\"chip\">Quinoa<\u002Fspan><span class=\"chip\">Tofu<\u002Fspan><span class=\"chip\">Avocado<\u002Fspan><span class=\"chip\">+2<\u002Fspan><\u002Fdiv>\n          <div class=\"ocard-foot\"><span class=\"lbl\">Building<\u002Fspan><span class=\"amt\">$12.25<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ocard\">\n          <div class=\"ocard-top\"><span class=\"ocard-id\">#22<\u002Fspan><span class=\"ostat done\"><span class=\"d\"><\u002Fspan>Paid · 7s<\u002Fspan><\u002Fdiv>\n          <div class=\"ocard-items\"><span class=\"chip\">Greens<\u002Fspan><span class=\"chip\">Salmon<\u002Fspan><span class=\"chip\">+3<\u002Fspan><\u002Fdiv>\n          <div class=\"ocard-foot\"><span class=\"lbl\">Closed<\u002Fspan><span class=\"amt\">$14.00<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ROI -->\n  <section class=\"section wrap\" id=\"roi\">\n    <div class=\"reveal\"><span class=\"eyebrow\">Return on investment<\u002Fspan>\n    <h2 class=\"h-sec\">See your savings in seconds.<\u002Fh2><\u002Fdiv>\n    <div class=\"roi reveal d1\">\n      <div class=\"roi-l\">\n        <p class=\"roi-intro\">Move the sliders to match your operation. Savings use a <strong>fully-loaded<\u002Fstrong> cashier rate, base wage plus payroll taxes, benefits, turnover, and compliance overhead, not just headline wage. Pricing is flat, one all-in monthly fee per location covering software and hardware lease, with nothing upfront.<\u002Fp>\n        <div class=\"sl\"><div class=\"sl-top\"><span class=\"sl-lbl\">Bowls per location, per day<\u002Fspan><span class=\"sl-val\" id=\"bowls-display\">250<\u002Fspan><\u002Fdiv><input type=\"range\" id=\"roi-bowls\" oninput=\"calcROI()\"><\u002Fdiv>\n        <div class=\"sl\"><div class=\"sl-top\"><span class=\"sl-lbl\">Cashier wage / hr, per location<\u002Fspan><span class=\"sl-val\" id=\"wage-display\">$20<\u002Fspan><\u002Fdiv><input type=\"range\" id=\"roi-wage\" oninput=\"calcROI()\"><\u002Fdiv>\n        <div class=\"sl\"><div class=\"sl-top\"><span class=\"sl-lbl\">Cashiers on shift, per location<\u002Fspan><span class=\"sl-val\" id=\"cashiers-display\">1<\u002Fspan><\u002Fdiv><input type=\"range\" id=\"roi-cashiers\" oninput=\"calcROI()\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"roi-r\">\n        <span class=\"roi-res-lbl\">Estimated net monthly savings<\u002Fspan>\n        <div class=\"roi-res-v skeleton\" id=\"roi-monthly\" data-val=\"0\">$0<\u002Fdiv>\n        <span class=\"roi-res-lbl\">Estimated annual labor savings<\u002Fspan>\n        <div class=\"roi-res-v accent skeleton\" id=\"roi-annual\" data-val=\"0\">$0<\u002Fdiv>\n        <div class=\"roi-rule\"><\u002Fdiv>\n        <div class=\"roi-mini\">\n          <div><span class=\"roi-res-lbl\">All-in monthly cost<\u002Fspan><div class=\"roi-res-v skeleton\" id=\"roi-fee\">$598<\u002Fdiv><\u002Fdiv>\n          <div><span class=\"roi-res-lbl\">Return on cost<\u002Fspan><div class=\"roi-res-v skeleton\" id=\"roi-payback\">7.7×<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"roi-mini\" style=\"margin-top:10px;\">\n          <div><span class=\"roi-res-lbl\">Fully-loaded cashier rate<\u002Fspan><div class=\"roi-res-v skeleton\" id=\"roi-loaded\">$27.35/hr<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- scalability -->\n  <section class=\"section wrap\" id=\"scale\">\n    <div class=\"reveal\"><span class=\"eyebrow\">Built to scale<\u002Fspan>\n    <h2 class=\"h-sec\">A small recovery rate, multiplied across your footprint.<\u002Fh2>\n    <p class=\"sub\">Under-ringing is easy to miss order by order. Even a conservative recovery rate compounds fast once you multiply it by volume, and by locations.<\u002Fp><\u002Fdiv>\n    <div class=\"scale-row reveal d1\">\n      <div class=\"scale-card\"><div class=\"scale-v\">$17.50<\u002Fdiv><div class=\"scale-l\">Avg. bowl price<\u002Fdiv><\u002Fdiv>\n      <div class=\"scale-arr\">×1% recovered<\u002Fdiv>\n      <div class=\"scale-card\"><div class=\"scale-v\">$0.18<\u002Fdiv><div class=\"scale-l\">Recovered, per bowl<\u002Fdiv><\u002Fdiv>\n      <div class=\"scale-arr\">×1,800 bowls/day<\u002Fdiv>\n      <div class=\"scale-card\"><div class=\"scale-v\">$315<\u002Fdiv><div class=\"scale-l\">Recovered, per location per day<\u002Fdiv><\u002Fdiv>\n      <div class=\"scale-arr\">×250 locations<\u002Fdiv>\n      <div class=\"scale-card scale-card-total\"><div class=\"scale-v\">$78,750<\u002Fdiv><div class=\"scale-l\">Recovered, per day network-wide<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:.78rem;color:var(--muted);margin-top:18px;\">Illustrative model based on a 1% billing-accuracy recovery rate; actual recovery depends on your menu, pricing, and current under-ring rate.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- fit / comparison -->\n  <section class=\"section dark\">\n    <div class=\"wrap\">\n      <div class=\"reveal\"><span class=\"eyebrow\">Will it fit my line?<\u002Fspan>\n      <h2 class=\"h-sec\">Built for the line you already run.<\u002Fh2>\n      <p class=\"sub\" style=\"color:var(--muted-d);\">Your POS records what the cashier types, not what's actually in the bowl. Tally closes that gap, installing above your line in a few hours with no change to your layout, menu, or staff workflow, and rolls out the same way at your next 10 locations as your first.<\u002Fp>\n      <p class=\"sub\" style=\"color:var(--muted-d);\">Built for assembly-line, build-your-own concepts, the <strong>Chipotle<\u002Fstrong>, <strong>Cava<\u002Fstrong>, and <strong>Sweetgreen<\u002Fstrong> style of line.<\u002Fp><\u002Fdiv>\n      <div class=\"cmp-wrap reveal d1\">\n        <table class=\"cmp\">\n          <thead><tr><th>Capability<\u002Fth><th class=\"hl\">Tally<\u002Fth><th>Cashier<\u002Fth><th>Kiosk<\u002Fth><th>Other AI<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td>Works during active assembly<\u002Ftd><td class=\"hl\"><span class=\"yes\">Yes<\u002Fspan><\u002Ftd><td><span class=\"no\">No<\u002Fspan><\u002Ftd><td><span class=\"no\">No<\u002Fspan><\u002Ftd><td><span class=\"no\">No<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>No guest or staff action needed<\u002Ftd><td class=\"hl\"><span class=\"yes\">Yes<\u002Fspan><\u002Ftd><td><span class=\"no\">No<\u002Fspan><\u002Ftd><td><span class=\"no\">No<\u002Fspan><\u002Ftd><td><span class=\"part\">Partial<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Reduces or removes cashier labor<\u002Ftd><td class=\"hl\"><span class=\"yes\">Yes<\u002Fspan><\u002Ftd><td><span class=\"no\">No<\u002Fspan><\u002Ftd><td><span class=\"part\">Partial<\u002Fspan><\u002Ftd><td><span class=\"no\">No<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Keeps your existing layout<\u002Ftd><td class=\"hl\"><span class=\"yes\">Yes<\u002Fspan><\u002Ftd><td><span class=\"yes\">Yes<\u002Fspan><\u002Ftd><td><span class=\"no\">No<\u002Fspan><\u002Ftd><td><span class=\"no\">No<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Live analytics dashboard<\u002Ftd><td class=\"hl\"><span class=\"yes\">Yes<\u002Fspan><\u002Ftd><td><span class=\"no\">No<\u002Fspan><\u002Ftd><td><span class=\"part\">Limited<\u002Fspan><\u002Ftd><td><span class=\"part\">Varies<\u002Fspan><\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- pricing -->\n  <section class=\"section wrap\" id=\"pricing\">\n    <div class=\"reveal\"><span class=\"eyebrow\">Simple pricing<\u002Fspan>\n    <h2 class=\"h-sec\">One flat monthly fee. Nothing upfront.<\u002Fh2>\n    <p class=\"sub\">A fraction of one cashier's cost. No capital outlay, the hardware is leased and Tally owns and maintains it.<\u002Fp><\u002Fdiv>\n    <div class=\"price-grid reveal d1\">\n      <div class=\"pcard\">\n        <div class=\"pcard-tag\">Per location<\u002Fdiv>\n        <div class=\"pcard-name\">Software<\u002Fdiv>\n        <div class=\"pcard-price\"><span class=\"n\" id=\"num-price-pilot\">$399<\u002Fspan><span class=\"per\">/ mo<\u002Fspan><\u002Fdiv>\n        <p class=\"pcard-note\">The AI that reads and bills your line.<\u002Fp>\n        <ul><li>Real-time ingredient detection<\u002Fli><li>Live order dashboard<\u002Fli><li>Shift &amp; speed analytics<\u002Fli><li>Remote menu &amp; pricing updates<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n      <div class=\"pcard feat\">\n        <div class=\"pcard-tag\">Most popular<\u002Fdiv>\n        <div class=\"pcard-name\">All-in, per location<\u002Fdiv>\n        <div class=\"pcard-price\"><span class=\"n\" id=\"num-price-multi\">$598<\u002Fspan><span class=\"per\">/ mo<\u002Fspan><\u002Fdiv>\n        <p class=\"pcard-note\">Everything, one number, software plus hardware.<\u002Fp>\n        <ul><li>Everything in Software<\u002Fli><li>Camera hardware &amp; install included<\u002Fli><li>Ongoing maintenance &amp; support<\u002Fli><li>No upfront capital cost<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n      <div class=\"pcard\">\n        <div class=\"pcard-tag\">Per location<\u002Fdiv>\n        <div class=\"pcard-name\">Hardware lease<\u002Fdiv>\n        <div class=\"pcard-price\"><span class=\"n\" id=\"num-price-hw\">$199<\u002Fspan><span class=\"per\">/ mo<\u002Fspan><\u002Fdiv>\n        <p class=\"pcard-note\">Tally owns and maintains the hardware.<\u002Fp>\n        <ul><li>AI cameras &amp; mounting kit<\u002Fli><li>Install in a few hours<\u002Fli><li>POS / payment integration<\u002Fli><li>Swaps &amp; upgrades covered<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FAQ -->\n  <section class=\"section wrap\" id=\"faq\">\n    <div class=\"reveal\"><span class=\"eyebrow\">Common questions<\u002Fspan>\n    <h2 class=\"h-sec\">Before you apply.<\u002Fh2><\u002Fdiv>\n    <div class=\"faq reveal d1\">\n      <div class=\"faq-item\">\n        <button class=\"faq-q\"><span>Can Tally handle my specific menu and layout?<\u002Fspan><span class=\"pm\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq-a\"><p>Yes, station count, ingredient list, modifiers, combos, and pricing are configured to match your actual line during setup, not a fixed template. Multi-concept operators can run different configurations per location. Menu changes and seasonal items are updated remotely, without touching the hardware.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\"><span>What happens if the AI misreads an ingredient?<\u002Fspan><span class=\"pm\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq-a\"><p>Every order includes a manual override at the register, so staff can adjust any line before the guest pays. 99% accuracy is a target we're validating pilot-by-pilot, not an audited guarantee, see Assumptions &amp; methodology above.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\"><span>Does this actually reduce chargebacks?<\u002Fspan><span class=\"pm\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq-a\"><p>Every charge is tied to a timestamped record of the ingredients added at assembly, which gives you fast, concrete evidence when a guest disputes a charge. We expect this to reduce successful \"item not received\" and friendly-fraud disputes versus a manually-rung order, we don't yet have audited multi-location dispute-rate data to cite. See Assumptions &amp; methodology.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n            <div class=\"faq-item\">\n        <button class=\"faq-q\"><span>What if the internet or power goes down?<\u002Fspan><span class=\"pm\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq-a\"><p>Staff can enter totals manually through your existing POS so the line keeps moving. We'll confirm the specific fallback for your setup during pilot scoping.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\"><span>Which POS systems does Tally work with?<\u002Fspan><span class=\"pm\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq-a\"><p>Tally hands off to your existing POS for payment. Tell us your system when you apply and we'll confirm compatibility before your pilot starts.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\"><span>How long does installation take?<\u002Fspan><span class=\"pm\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq-a\"><p>Typically a few hours, mounted above your existing assembly line. No changes to your layout, menu, or staff workflow are required.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\"><span>What does the pilot commitment look like?<\u002Fspan><span class=\"pm\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq-a\"><p>Pilot pricing is billed monthly. Commitment length and cancellation terms are confirmed in your pilot agreement, ask us for current terms when you apply.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\"><span>Is guest and staff data private?<\u002Fspan><span class=\"pm\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq-a\"><p>Tally processes visual ingredient data at the point of assembly to calculate a total. We do not use facial recognition or collect biometric identifiers as part of this function. See Legal &amp; disclaimers in the footer for our full data notice.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\"><span>Do you support cash payments?<\u002Fspan><span class=\"pm\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq-a\"><p>Yes, cash still routes through staff at your existing register. Card and contactless are the flow Tally is built to speed up.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\"><span>What if I run more than two locations?<\u002Fspan><span class=\"pm\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq-a\"><p>Our Multi-location plan bundles two sites on one dashboard. For larger groups, contact us directly for custom pricing.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- pilot CTA -->\n  <section class=\"section dark cta-watermark\" id=\"contact\">\n    <div class=\"wrap\"><div class=\"cta reveal\">\n      <span class=\"eyebrow\">Apply for pilot access<\u002Fspan>\n      <h2 class=\"h-sec\">See whether Tally fits your line.<\u002Fh2>\n      <p class=\"sub\">Zero risk to start: we install at one location, run it live during real service, and show you the numbers from your own operation before any commitment. Tell us your restaurant, city, POS, and order volume, we'll review fit and reply with next steps.<\u002Fp>\n      <form class=\"cta-form\" id=\"pilot-form\" onsubmit=\"return submitPilotForm(event)\">\n        <input type=\"text\" name=\"name\" placeholder=\"Your name\" required=\"\"><input type=\"text\" name=\"restaurant\" placeholder=\"Restaurant\" required=\"\">\n        <input type=\"tel\" name=\"phone\" placeholder=\"Phone\" required=\"\"><input type=\"text\" name=\"city\" placeholder=\"City\" required=\"\">\n        <input type=\"text\" name=\"pos\" placeholder=\"POS system (optional)\"><input type=\"text\" name=\"orders\" placeholder=\"Avg. daily orders (optional)\">\n        <button class=\"btn btn-accent full\" type=\"submit\" id=\"pilot-submit\">Apply for a pilot <span class=\"arr\">→<\u002Fspan><\u002Fbutton>\n      <\u002Fform>\n      <div class=\"cta-success\" id=\"pilot-success\">\n        <div class=\"cta-success-check\">✓<\u002Fdiv>\n        <h3>Thanks, you're on the list.<\u002Fh3>\n        <p>We review every application personally and reply within 2 business days at the phone number you gave us.<\u002Fp>\n      <\u002Fdiv>\n      <p class=\"cta-alt\" id=\"pilot-alt\">Takes about 30 seconds · Or email us directly · <a href=\"mailto:neb@tallytodayai.com\">neb@tallytodayai.com<\u002Fa><\u002Fp>\n    <\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- assumptions, tucked away -->\n  <section class=\"wrap\" id=\"assumptions\" style=\"padding:48px 0 72px;scroll-margin-top:90px;\">\n    <details class=\"assume\">\n      <summary>Assumptions &amp; methodology<\u002Fsummary>\n      <p style=\"font-size:.78rem;color:var(--muted);margin:14px 0 4px;font-weight:600;\">Source: public SEC filings &amp; wage data<\u002Fp>\n      <ol>\n        <li>Chipotle FY2025 10-K (period ended Dec 31, 2025): 4,056 restaurants; labor cost of $2,991,680K; labor at 25.1% of revenue. <em>SEC EDGAR.<\u002Fem><\u002Fli>\n        <li>Chipotle FY2024 10-K: 130,504 employees worldwide (126,233 in-restaurant) as of Dec 31, 2024, most recent filing with precise headcount. <em>SEC EDGAR.<\u002Fem><\u002Fli>\n        <li>Cava Group FY2025 10-K (period ended Dec 28, 2025): ~12,900 restaurant team members across 439 restaurants; FY2025 revenue $1,179.7M; labor ~25.8% of revenue.<\u002Fli>\n        <li>44,000+ fast casual units excludes QSRs (Technomic Top 500, 2025).<\u002Fli>\n        <li>NY State minimum wage, effective Jan 1, 2026: $17.00/hr downstate NYC, no tip credit for fast food chains (NY DOL).<\u002Fli>\n      <\u002Fol>\n      <p style=\"font-size:.78rem;color:var(--muted);margin:26px 0 4px;font-weight:600;\">Company analysis, not sourced to filings<\u002Fp>\n      <ol>\n        <li>$20.00/hr NYC market wage: above the $17.00 legal floor, reflecting competitive NYC fast-casual hiring, a modeling choice, not filed data.<\u002Fli>\n        <li>Payroll taxes &amp; insurance, ~12% of wages: FICA (statutory) plus NY SUI, FUTA, MTA payroll tax, workers' comp, and DBL, an estimated composite, not itemized in any filing.<\u002Fli>\n        <li>OT / spread-of-hours premium, ~3% of wages: NY spread-of-hours rule, estimated incidence.<\u002Fli>\n        <li>Benefits, meals &amp; uniforms, ~$2.15/hr: estimated partial benefit take-up typical of fast-casual crews, not company-specific.<\u002Fli>\n        <li>Turnover cost, amortized, ~$1.70/hr: assumes ~120%+ annual churn (industry-typical, not Chipotle/Cava-specific) × ~$3,000 replacement cost per hire, both industry rules of thumb, not sourced to a filing.<\u002Fli>\n        <li>Compliance &amp; scheduling admin, ~$0.50/hr: NYC Fair Workweek overhead estimate.<\u002Fli>\n        <li>Coverage hours for \"per cashier position\": 60 hrs/wk peak-only, or 91 hrs/wk open-to-close, an operational assumption, not derived from any filing.<\u002Fli>\n        <li>*Checkout time (43s baseline to 8s with Tally) is an estimate based on internal testing, not an audited multi-location result.<\u002Fli>\n        <li>†\"Zero cashier labor\" applies to card and contactless transactions today; cash currently routes through your existing POS with staff input.<\u002Fli>\n        <li>Hardware is leased (included in the all-in monthly fee), not a capital purchase; there is no upfront hardware cost to the operator. Net savings and return-on-cost depend on location volume, staffing, wage, and operating hours.<\u002Fli>\n        <li>Card and contactless transactions avoid dedicated cashier input; cash may require staff input through your existing POS.<\u002Fli>\n        <li>‡Chargeback economics: processors charge merchants a non-refundable fee per dispute, commonly $15–$50, and up to ~$100 for high-risk accounts, on top of the lost sale and staff time (Mastercard 2025 State of Chargebacks; Investopedia; Chargebacks911, 2026). At an assumed ~1 disputed transaction per 1,000 orders, a 250-bowl/day location clears ~91,000 card orders/yr, so even a handful of disputes eliminated per month recovers hundreds of dollars annually in fees alone, before counting recovered sale value. Dispute reduction is an expected benefit of a timestamped, itemized visual record tied to each charge, not yet measured across live pilots.<\u002Fli>\n      <\u002Fol>\n    <\u002Fdetails>\n  <\u002Fsection>\n<\u002Fdiv>\n<!-- ══════════ END RESTAURANTS ══════════ -->\n\n<!-- ══════════ INVESTORS ══════════ -->\n<div class=\"page\" id=\"page-investor\">\n  <section class=\"inv-hero\">\n    <div class=\"wrap inv-hero-in\">\n      <span class=\"eyebrow\" style=\"color:var(--muted-d);\">Investor overview<\u002Fspan>\n      <h1 class=\"inv-title\">Cut the single largest controllable cost in fast casual.<\u002Fh1>\n      <p class=\"sub\" style=\"color:var(--muted-d);max-width:60ch;\">Labor is the line item operators fight hardest to manage, and the register is pure cost. Tally's AI removes the cashier at assembly-line restaurants, turning a recurring wage into a flat, fast-payback fee. Restaurant groups can significantly expand margins across a multi-location portfolio.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"wrap\" style=\"padding:0;\">\n    <div class=\"metrics reveal\" style=\"margin-top:-44px;position:relative;z-index:2;\">\n      <div class=\"metric\"><div class=\"metric-v\" id=\"num-tam\" style=\"color:var(--total-d);\">$99B+<\u002Fdiv><div class=\"metric-l\">Directional TAM<\u002Fdiv><\u002Fdiv>\n      <div class=\"metric\"><div class=\"metric-v\" id=\"num-units\">44,000+<\u002Fdiv><div class=\"metric-l\">Fast casual units<\u002Fdiv><\u002Fdiv>\n      <div class=\"metric\"><div class=\"metric-v\" id=\"num-arr\" style=\"color:var(--total-d);\">$6M<\u002Fdiv><div class=\"metric-l\">24-mo ARR target<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"section wrap\" id=\"why-now\">\n    <div class=\"reveal\"><span class=\"eyebrow\">Why now<\u002Fspan>\n    <h2 class=\"h-sec\">Three shifts make this the moment.<\u002Fh2><\u002Fdiv>\n    <div class=\"opp reveal d1\">\n      <div class=\"opp-card\"><div class=\"opp-n\" style=\"color:var(--total-d);\">↑<\u002Fdiv><h3>Labor costs keep climbing<\u002Fh3><p>NYC's wage floor keeps rising, and a fully-loaded cashier now runs past $27/hr once tax, benefits, and turnover are counted. The cost of standing still keeps going up.<\u002Fp><\u002Fdiv>\n      <div class=\"opp-card\"><div class=\"opp-n\">↓<\u002Fdiv><h3>AI vision hit cost parity<\u002Fh3><p>Real-time ingredient detection that once required enterprise computer-vision budgets now runs on commodity hardware, cheap enough to install and pay back in under a week.<\u002Fp><\u002Fdiv>\n      <div class=\"opp-card\"><div class=\"opp-n\" style=\"color:var(--total-d);\">↗<\u002Fdiv><h3>The format keeps scaling<\u002Fh3><p>Assembly-line fast casual keeps opening units, Chipotle and Cava alone run thousands of locations that share the exact same checkout bottleneck. Fast casual growth is expected to continue for decades.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"section wrap\" id=\"opportunity\">\n    <div class=\"reveal\"><span class=\"eyebrow\">The opportunity<\u002Fspan>\n    <h2 class=\"h-sec\">A market hiding in plain sight.<\u002Fh2>\n    <p class=\"sub\">We target fast casual concepts with visible assembly lines, not QSRs. The wedge is labor, speed, and margin at the exact point where the order is built but payment slows the line. The same visual record that tallies the price also gives operators a paper trail against chargebacks and pricing errors, margin protection, not just speed.<\u002Fp><\u002Fdiv>\n    <div class=\"opp reveal d1\">\n      <div class=\"opp-card\"><div class=\"opp-n\" style=\"color:var(--total-d);\">$27/hr<\u002Fdiv><h3>Fully-loaded labor cost<\u002Fh3><p>NYC cashier cost isn't just wage, payroll tax, benefits, turnover, and compliance overhead push a $20/hr role past $27/hr, loaded. Tally removes it entirely.<\u002Fp><\u002Fdiv>\n      <div class=\"opp-card\"><div class=\"opp-n\">~8 sec*<\u002Fdiv><h3>Speed unlock<\u002Fh3><p>Checkout collapses from a queue to a tap, keeping peak-period orders moving when it matters most.<\u002Fp><\u002Fdiv>\n      <div class=\"opp-card\"><div class=\"opp-n\" style=\"color:var(--total-d);\">$598<\u002Fdiv><h3>Recurring model<\u002Fh3><p>Flat all-in monthly fee per location, $399 software plus a $199 hardware lease. Predictable recurring revenue, no operator capex, fast payback on labor.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"section dark\" id=\"raise\">\n    <div class=\"wrap\">\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"section wrap\" id=\"team\">\n    <div class=\"reveal\"><span class=\"eyebrow\">Team<\u002Fspan>\n    <h2 class=\"h-sec\">Built by an operator-minded founder.<\u002Fh2><\u002Fdiv>\n    <div class=\"team reveal d1\">\n      <div class=\"tcard\"><div class=\"tava\">NE<\u002Fdiv><h3>Neb Esayas, CFA<\u002Fh3><div class=\"role\">Founder<\u002Fdiv><a href=\"https://www.linkedin.com/in/nesayas/\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;margin-top:10px;font-size:.82rem;font-weight:600;\">LinkedIn →<\u002Fa><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"section dark cta-watermark\">\n    <div class=\"wrap\"><div class=\"cta reveal\">\n      <span class=\"eyebrow\">Investor materials<\u002Fspan>\n      <h2 class=\"h-sec\">Request the full data room.<\u002Fh2>\n      <p class=\"sub\">Detailed model, pilot data, and deployment economics available on request.<\u002Fp>\n      <div class=\"hero-actions\" style=\"justify-content:center;margin-top:8px;\">\n        <a class=\"btn btn-accent\" href=\"mailto:neb@tallytodayai.com?subject=Tally%20Data%20Room%20Request&amp;body=Hi%20Neb%2C%0A%0AI'd%20like%20access%20to%20the%20Tally%20data%20room%3A%20financial%20model%2C%20pilot%20data%2C%20and%20deployment%20economics.%0A%0AName%3A%0AFirm%3A%0A%0AThanks%2C\">Request materials <span class=\"arr\">→<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<!-- ══════════ END INVESTORS ══════════ -->\n\n<footer>\n  <div class=\"wrap\">\n    <div class=\"foot-wordmark-wrap\">\n      <div class=\"foot-wordmark\">\n        <span class=\"foot-wm-mark\"><svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><rect x=\"6\" y=\"7\" width=\"4\" height=\"26\" rx=\"2\" fill=\"#E0A53C\"><\u002Frect><rect x=\"14\" y=\"7\" width=\"4\" height=\"26\" rx=\"2\" fill=\"#E0A53C\"><\u002Frect><rect x=\"22\" y=\"7\" width=\"4\" height=\"26\" rx=\"2\" fill=\"#E0A53C\"><\u002Frect><rect x=\"30\" y=\"7\" width=\"4\" height=\"26\" rx=\"2\" fill=\"#E0A53C\"><\u002Frect><rect x=\"18\" y=\"1.5\" width=\"4\" height=\"37\" rx=\"2\" fill=\"#3F8F5B\" transform=\"rotate(45 20 20)\"><\u002Frect><\u002Fsvg><\u002Fspan>\n        <span class=\"foot-wm-name\">Tally<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div c
